services:
  db:
    image: postgres:16-alpine
    container_name: vowchek-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vowchek
    ports:
      - '5432:5432'
    volumes:
      - vowchek_pgdata:/var/lib/postgresql/data

volumes:
  vowchek_pgdata: